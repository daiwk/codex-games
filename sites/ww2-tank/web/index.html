<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171d17">
  <meta name="description" content="带领坦克、步兵和飞机穿过平原，翻越群山。在补给点恢复幸存部队，抵达海滩并阻击敌方登陆部队。">
  <title>二战：装甲战线</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="web.css">
  <script defer src="game.js"></script>
  <script defer src="web-app.js"></script>
</head>
<body>
  <main id="stage" aria-label="二战：装甲战线">
    <canvas id="canvas" width="1280" height="800" tabindex="0"
      aria-label="选择简单、普通或困难以开始战役，可按 1 到 3 直接出发。WASD 移动，鼠标瞄准，空格开火，驾驶飞机时按 B 投弹。到达补给点恢复。按 Q 打开友军列表，按 1 到 7 选择本页单位，Page Up 和 Page Down 翻页。Tab 锁定或释放鼠标，Esc 暂停，R 重开任务。"></canvas>

    <section id="cover" aria-labelledby="game-title">
      <div class="launch-copy">
        <h1 id="game-title">二战：装甲战线</h1>
        <p class="intro">选择难度后，率领 10 辆坦克、20 名步兵和 5 架飞机穿过平原与群山。击退海滩上的登陆部队才算完成任务。</p>
        <dl class="controls">
          <div><dt><kbd>WASD</kbd></dt><dd>四方向移动</dd></div>
          <div><dt>鼠标 · 空格</dt><dd>鼠标瞄准，空格开火</dd></div>
          <div><dt><kbd>B</kbd></dt><dd>驾驶飞机时投弹</dd></div>
          <div><dt>补给点</dt><dd>恢复存活单位的生命</dd></div>
          <div><dt><kbd>Q</kbd><kbd>1–7</kbd></dt><dd>打开列表，选择本页友军</dd></div>
          <div><dt><kbd>PgUp</kbd><kbd>PgDn</kbd></dt><dd>翻页查看友军</dd></div>
          <div><dt><kbd>Tab</kbd></dt><dd>锁定或释放鼠标</dd></div>
          <div><dt><kbd>Esc</kbd><kbd>R</kbd><kbd>F</kbd></dt><dd>暂停、重开任务、全屏</dd></div>
        </dl>
        <div class="launch-actions">
          <button id="start-btn" type="button" hidden>重新载入</button>
          <button id="fullscreen-btn" type="button">全屏</button>
        </div>
        <div id="load-progress">
          <progress id="progress" max="100" aria-label="游戏资源载入进度"></progress>
          <p id="status" role="status">正在准备战场资源…</p>
        </div>
        <p id="error" role="alert" hidden></p>
        <p id="device-note" hidden>建议在支持 WebGL 2 的桌面浏览器中使用键盘和鼠标。</p>
        <a class="credits" href="credits.txt" target="_blank" rel="noopener">制作与许可</a>
      </div>
      <div class="observation" aria-hidden="true">
        <span class="scope"></span>
      </div>
      <noscript>请启用 JavaScript 后载入游戏。</noscript>
    </section>

    <p id="browser-note" role="status" hidden></p>
  </main>
</body>
</html>
