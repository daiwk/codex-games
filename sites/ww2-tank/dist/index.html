<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171d17">
  <meta name="description" content="切换操控坦克、步兵与飞机，在村庄、开阔地和林带间迎击五波敌军。炮弹可以摧毁村里的建筑掩体。">
  <title>二战：装甲战线</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="web.css?v=5256c5ce3b9a7c86">
  <script defer src="game.js?v=358e58db4bc8c49c"></script>
  <script defer src="web-app.js?v=d6e6b98294c6a50f"></script>
</head>
<body>
  <main id="stage" aria-label="二战：装甲战线">
    <canvas id="canvas" width="1280" height="800" tabindex="0"
      aria-label="第三人称波次对战。WASD 移动，鼠标瞄准，空格开火，驾驶飞机时按 B 投弹，波次间按 H 恢复，按 Q 打开切换列表，按 1 到 7 选择友军，Tab 锁定或释放鼠标，Esc 暂停，R 重开。"></canvas>

    <section id="cover" aria-labelledby="game-title">
      <div class="launch-copy">
        <h1 id="game-title">二战：装甲战线</h1>
        <p class="intro">与坦克、步兵和飞机并肩迎击 5 波敌军。第 5 波有首领。</p>
        <dl class="controls">
          <div><dt><kbd>WASD</kbd></dt><dd>四方向移动</dd></div>
          <div><dt>鼠标 · 空格</dt><dd>鼠标瞄准，空格开火</dd></div>
          <div><dt><kbd>B</kbd></dt><dd>驾驶飞机时投弹</dd></div>
          <div><dt><kbd>H</kbd></dt><dd>休整时恢复当前单位</dd></div>
          <div><dt><kbd>Q</kbd><kbd>1–7</kbd></dt><dd>打开列表，选择要接管的友军</dd></div>
          <div><dt><kbd>Tab</kbd></dt><dd>锁定或释放鼠标</dd></div>
          <div><dt><kbd>Esc</kbd><kbd>R</kbd><kbd>F</kbd></dt><dd>暂停、重开、全屏</dd></div>
        </dl>
        <div class="launch-actions">
          <button id="start-btn" type="button" hidden>重新载入</button>
          <button id="fullscreen-btn" type="button">全屏</button>
        </div>
        <div id="load-progress">
          <progress id="progress" max="100" aria-label="游戏资源载入进度"></progress>
          <p id="status" role="status">正在准备战场资源…</p>
        </div>
        <p id="error" role="alert" hidden></p>
        <p id="device-note" hidden>建议在支持 WebGL 2 的桌面浏览器中使用键盘和鼠标。</p>
        <a class="credits" href="credits.txt" target="_blank" rel="noopener">制作与许可</a>
      </div>
      <div class="observation" aria-hidden="true">
        <span class="scope"></span>
      </div>
      <noscript>请启用 JavaScript 后载入游戏。</noscript>
    </section>

    <p id="browser-note" role="status" hidden></p>
  </main>
</body>
</html>
